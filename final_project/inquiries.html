<body>
    <header>
        <section id="title-hero-image">
            <h1>Rabbits & You</h1>
            <picture>
                <source srcset="images/hero-image.webp" media="(min-width: 400px)" width="1280" height="392">
                <img src="images/hero-image-small.webp" alt="Image of Chicago" width="398" height="191">

        </section>
        <button id="nav-button" aria-label="Hamburger Button">Inquiries</button>
        <nav id="nav-bar" class="navigation">

            </ul>
        </nav>

    <main>
        <h2>Got a question? Ask away!</h2>
        <form method="get" action="inquiries_thanks.html">
            <label id="name-label">Name <input type="text" name="name" title="Your Name" autocomplete="given-name" required></label>
            <label id="email-label">Email Address <input type="email" 
                                            name="email" 
                                            title="Your email formatted as: example@domain.com" 
                                            autocomplete="email"
                                            placeholder="example@domain.com"
                                            required></label>
            <label id="question-label">Your Question 
                    <textarea 
                        id="question-input"
                        name="question" 
                        title="A description of your business">
                    </textarea>
            </label>

            <input type="submit" value="Send Your Question" id="submit-question-button">
        </form>
    </main>

    <footer>
        <div id="copyright-info">
            <span id="current-year"></span>

            <a href="attributions.html">Attributions</a>
